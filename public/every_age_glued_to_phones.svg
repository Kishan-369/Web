<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#050814" />
      <stop offset="60%" stop-color="#0a0f24" />
      <stop offset="100%" stop-color="#02040a" />
    </linearGradient>

    <!-- Couch / Room Shadow -->
    <linearGradient id="couch-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141a2e" />
      <stop offset="100%" stop-color="#080c17" />
    </linearGradient>

    <!-- Screen Glow Gradients -->
    <!-- Child Glow (Warm Amber/Cyan Cartoons) -->
    <radialGradient id="child-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#0284c7" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </radialGradient>

    <!-- Teen Glow (Electric Reels Cyan/Neon) -->
    <radialGradient id="teen-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#67e8f9" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#06b6d4" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>

    <!-- Young Woman Glow (Instagram Pink/Magenta) -->
    <radialGradient id="woman-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f472b6" stop-opacity="0.95" />
      <stop offset="40%" stop-color="#db2777" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#db2777" stop-opacity="0" />
    </radialGradient>

    <!-- Adult Father Glow (WhatsApp Emerald) -->
    <radialGradient id="adult-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4ade80" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#16a34a" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#16a34a" stop-opacity="0" />
    </radialGradient>

    <!-- Grandparent Glow (YouTube Red/Amber) -->
    <radialGradient id="elder-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fb923c" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#ea580c" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0" />
    </radialGradient>

    <!-- Blur Filter for Light Beams -->
    <filter id="soft-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="25" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="beam-blur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="15" />
    </filter>
  </defs>

  <!-- Deep Dark Room Background -->
  <rect width="1200" height="800" fill="url(#bg-grad)" />

  <!-- Room Architecture Silhouettes -->
  <rect x="0" y="700" width="1200" height="100" fill="#04060c" />
  <line x1="0" y1="700" x2="1200" y2="700" stroke="#111827" stroke-width="1.5" />

  <!-- Long Shared Sofa (Connecting all 5 generations) -->
  <path d="M 60 480 Q 600 460 1140 480 L 1160 680 L 40 680 Z" fill="url(#couch-grad)" />
  <path d="M 80 430 Q 600 410 1120 430 L 1140 480 Q 600 460 60 480 Z" fill="#1e293b" opacity="0.6" />

  <!-- Ambient Blue Cold Light Cast on Couch -->
  <ellipse cx="600" cy="550" rx="520" ry="120" fill="#0369a1" opacity="0.12" filter="url(#beam-blur)" />

  <!-- ============================================================== -->
  <!-- 1. LITTLE CHILD (Ages 2-8) - Far Left                          -->
  <!-- Sitting cross-legged on sofa, tiny hands gripping phone close  -->
  <!-- ============================================================== -->
  <g id="figure-child">
    <!-- Screen Light Cone onto Child Face -->
    <polygon points="175,540 120,440 220,430" fill="url(#child-glow)" opacity="0.65" filter="url(#beam-blur)" />
    
    <!-- Child Body Silhouette -->
    <!-- Torso -->
    <path d="M 140 490 Q 170 470 195 490 L 210 590 L 130 590 Z" fill="#0f172a" />
    <!-- Crossed Legs -->
    <ellipse cx="170" cy="600" rx="55" ry="25" fill="#0b1120" />
    <!-- Head tilted down hypnotized -->
    <circle cx="165" cy="445" r="32" fill="#0f172a" />
    <!-- Highlight on face profile from screen -->
    <path d="M 160 430 Q 185 445 178 470 Q 165 470 155 450 Z" fill="#38bdf8" opacity="0.75" />
    <!-- Child Hair -->
    <path d="M 140 435 Q 160 415 185 430 Q 170 420 150 425 Z" fill="#020617" />
    <!-- Hands holding phone horizontally -->
    <path d="M 145 520 L 175 538 L 195 525" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.7" />

    <!-- Smartphone Glowing Horizontally (Cartoons/Games) -->
    <g transform="translate(155, 525) rotate(-10)">
      <rect x="0" y="0" width="46" height="26" rx="4" fill="#38bdf8" filter="url(#soft-glow)" />
      <rect x="2" y="2" width="42" height="22" rx="3" fill="#ffffff" />
      <rect x="4" y="4" width="38" height="18" rx="2" fill="#38bdf8" opacity="0.8" />
      <!-- Animated Play Icon inside -->
      <polygon points="18,9 18,17 26,13" fill="#ffffff" />
    </g>
    <!-- Label -->
    <text x="170" y="650" fill="#94a3b8" font-size="14" font-weight="700" font-family="sans-serif" text-anchor="middle">CHILD</text>
    <text x="170" y="670" fill="#38bdf8" font-size="11" font-family="monospace" text-anchor="middle">Cartoons • 3.8h</text>
  </g>

  <!-- ============================================================== -->
  <!-- 2. TEENAGER / YOUTH (Ages 14-22) - Slouched, Hoodie, Reels     -->
  <!-- ============================================================== -->
  <g id="figure-teen">
    <!-- Screen Light Cone onto Teen Face -->
    <polygon points="380,510 330,370 420,380" fill="url(#teen-glow)" opacity="0.75" filter="url(#beam-blur)" />

    <!-- Slouched Body Silhouette with Hoodie -->
    <path d="M 330 450 Q 380 430 430 460 L 440 640 L 320 640 Z" fill="#0b1120" />
    <!-- Slouched Head with Hood -->
    <circle cx="375" cy="385" r="42" fill="#0f172a" />
    <path d="M 345 370 Q 380 345 410 375 L 415 425 Q 380 435 345 410 Z" fill="#090d16" />
    <!-- Face glow from screen -->
    <path d="M 365 375 Q 395 390 385 415 Q 370 415 360 395 Z" fill="#67e8f9" opacity="0.8" />
    <!-- Arms angled inward holding phone vertically -->
    <path d="M 340 480 L 375 510 L 410 490" stroke="#0284c7" stroke-width="12" stroke-linecap="round" fill="none" opacity="0.6" />

    <!-- Smartphone Glowing Vertically (Infinite Reels) -->
    <g transform="translate(365, 490) rotate(5)">
      <rect x="0" y="0" width="26" height="48" rx="4" fill="#67e8f9" filter="url(#soft-glow)" />
      <rect x="2" y="2" width="22" height="44" rx="3" fill="#ffffff" />
      <rect x="4" y="4" width="18" height="40" rx="2" fill="#06b6d4" opacity="0.85" />
      <!-- Vertical Reel Scroll Lines -->
      <line x1="6" y1="12" x2="20" y2="12" stroke="#ffffff" stroke-width="2" />
      <line x1="6" y1="18" x2="16" y2="18" stroke="#ffffff" stroke-width="1.5" />
      <circle cx="13" cy="32" r="4" fill="#ffffff" />
    </g>
    <!-- Label -->
    <text x="380" y="650" fill="#94a3b8" font-size="14" font-weight="700" font-family="sans-serif" text-anchor="middle">TEENAGER</text>
    <text x="380" y="670" fill="#67e8f9" font-size="11" font-family="monospace" text-anchor="middle">Reels • 6.4h</text>
  </g>

  <!-- ============================================================== -->
  <!-- 3. YOUNG WOMAN (Ages 20-30) - Center, Filtered Feeds & Stories -->
  <!-- ============================================================== -->
  <g id="figure-woman">
    <!-- Screen Light Cone onto Woman's Face (Pink/Magenta Glow) -->
    <polygon points="600,490 550,350 645,360" fill="url(#woman-glow)" opacity="0.8" filter="url(#beam-blur)" />

    <!-- Body Silhouette -->
    <path d="M 550 440 Q 600 420 645 440 L 655 640 L 540 640 Z" fill="#0f172a" />
    <!-- Head & Hair silhouette -->
    <circle cx="595" cy="365" r="38" fill="#090d16" />
    <!-- Hair cascade down shoulders -->
    <path d="M 565 350 Q 600 325 630 350 Q 640 410 635 460 Q 615 450 610 410 Q 580 410 565 440 Z" fill="#04060c" />
    <!-- Face profile glowing pink from Instagram -->
    <path d="M 585 355 Q 615 375 605 400 Q 590 400 580 380 Z" fill="#f472b6" opacity="0.85" />
    <!-- Arms holding phone in both hands -->
    <path d="M 560 470 L 595 495 L 630 475" stroke="#db2777" stroke-width="11" stroke-linecap="round" fill="none" opacity="0.6" />

    <!-- Smartphone Glowing (Instagram/Social Stories) -->
    <g transform="translate(585, 475) rotate(-3)">
      <rect x="0" y="0" width="28" height="52" rx="4" fill="#f472b6" filter="url(#soft-glow)" />
      <rect x="2" y="2" width="24" height="48" rx="3" fill="#ffffff" />
      <rect x="4" y="4" width="20" height="44" rx="2" fill="#ec4899" opacity="0.9" />
      <!-- Story Ring Icon -->
      <circle cx="14" cy="14" r="5" stroke="#ffffff" stroke-width="1.8" fill="none" />
      <rect x="7" y="24" width="14" height="8" rx="2" fill="#ffffff" />
      <line x1="7" y1="36" x2="21" y2="36" stroke="#ffffff" stroke-width="2" />
    </g>
    <!-- Label -->
    <text x="600" y="650" fill="#94a3b8" font-size="14" font-weight="700" font-family="sans-serif" text-anchor="middle">YOUNG ADULT</text>
    <text x="600" y="670" fill="#f472b6" font-size="11" font-family="monospace" text-anchor="middle">Feeds & DMs • 5.8h</text>
  </g>

  <!-- ============================================================== -->
  <!-- 4. WORKING ADULT / FATHER (Ages 35-50) - Hunched, WhatsApp     -->
  <!-- ============================================================== -->
  <g id="figure-adult">
    <!-- Screen Light Cone onto Adult Face (Emerald Green) -->
    <polygon points="815,505 770,360 865,370" fill="url(#adult-glow)" opacity="0.75" filter="url(#beam-blur)" />

    <!-- Broader Shouldered Silhouette with Collared Shirt -->
    <path d="M 760 440 Q 820 420 875 440 L 885 640 L 750 640 Z" fill="#0d1527" />
    <!-- Head tilted forward with neck strain -->
    <circle cx="815" cy="370" r="40" fill="#090d16" />
    <path d="M 785 365 Q 825 340 845 365 Q 840 400 815 410 Q 795 400 785 375 Z" fill="#050811" />
    <!-- Face profile illuminated green by WhatsApp -->
    <path d="M 800 365 Q 830 380 820 405 Q 805 405 795 385 Z" fill="#4ade80" opacity="0.8" />
    <!-- Arms holding device with thumbs typing -->
    <path d="M 780 475 L 815 505 L 850 480" stroke="#16a34a" stroke-width="12" stroke-linecap="round" fill="none" opacity="0.6" />

    <!-- Smartphone Glowing (WhatsApp Chats) -->
    <g transform="translate(803, 485) rotate(4)">
      <rect x="0" y="0" width="28" height="50" rx="4" fill="#4ade80" filter="url(#soft-glow)" />
      <rect x="2" y="2" width="24" height="46" rx="3" fill="#ffffff" />
      <rect x="4" y="4" width="20" height="42" rx="2" fill="#22c55e" opacity="0.9" />
      <!-- Message Bubbles inside -->
      <rect x="6" y="8" width="12" height="6" rx="2" fill="#ffffff" />
      <rect x="10" y="16" width="12" height="6" rx="2" fill="#ffffff" />
      <rect x="6" y="24" width="14" height="6" rx="2" fill="#ffffff" />
    </g>
    <!-- Label -->
    <text x="815" y="650" fill="#94a3b8" font-size="14" font-weight="700" font-family="sans-serif" text-anchor="middle">WORKING PARENT</text>
    <text x="815" y="670" fill="#4ade80" font-size="11" font-family="monospace" text-anchor="middle">Chats & News • 5.2h</text>
  </g>

  <!-- ============================================================== -->
  <!-- 5. ELDERLY GRANDPARENT (Ages 65+) - Spectacles, Arm Extended   -->
  <!-- ============================================================== -->
  <g id="figure-elder">
    <!-- Screen Light Cone onto Elder Face (Warm Amber) -->
    <polygon points="1025,525 970,380 1060,390" fill="url(#elder-glow)" opacity="0.75" filter="url(#beam-blur)" />

    <!-- Elder Silhouette (Shawl / Traditional Attire) -->
    <path d="M 970 450 Q 1025 430 1080 450 L 1090 640 L 960 640 Z" fill="#0c1222" />
    <path d="M 960 470 Q 1025 450 1090 470 L 1085 580 Q 1025 560 965 580 Z" fill="#1e293b" opacity="0.4" />
    <!-- Head with bun / spectacles -->
    <circle cx="1020" cy="385" r="38" fill="#080d1a" />
    <circle cx="1045" cy="365" r="16" fill="#050811" /> <!-- Hair bun -->
    <!-- Eyeglasses Silhouette Glowing -->
    <circle cx="1015" cy="380" r="9" stroke="#fb923c" stroke-width="2.5" fill="none" opacity="0.9" />
    <line x1="1024" y1="380" x2="1030" y2="380" stroke="#fb923c" stroke-width="2" />
    <!-- Face profile glowing amber -->
    <path d="M 1005 375 Q 1035 390 1025 415 Q 1010 415 1000 395 Z" fill="#fb923c" opacity="0.75" />
    <!-- Arms holding phone further away due to presbyopia -->
    <path d="M 990 480 L 1025 520 L 1060 490" stroke="#ea580c" stroke-width="10" stroke-linecap="round" fill="none" opacity="0.6" />

    <!-- Smartphone Glowing with Large Font (Viral Forwards) -->
    <g transform="translate(1010, 505) rotate(-6)">
      <rect x="0" y="0" width="30" height="52" rx="4" fill="#fb923c" filter="url(#soft-glow)" />
      <rect x="2" y="2" width="26" height="48" rx="3" fill="#ffffff" />
      <rect x="4" y="4" width="22" height="44" rx="2" fill="#f97316" opacity="0.9" />
      <!-- Big Text lines -->
      <line x1="7" y1="12" x2="23" y2="12" stroke="#ffffff" stroke-width="3" />
      <line x1="7" y1="20" x2="21" y2="20" stroke="#ffffff" stroke-width="3" />
      <line x1="7" y1="28" x2="18" y2="28" stroke="#ffffff" stroke-width="3" />
    </g>
    <!-- Label -->
    <text x="1025" y="650" fill="#94a3b8" font-size="14" font-weight="700" font-family="sans-serif" text-anchor="middle">GRANDPARENT</text>
    <text x="1025" y="670" fill="#fb923c" font-size="11" font-family="monospace" text-anchor="middle">Forwards • 4.6h</text>
  </g>

  <!-- Hypnotic Connection Pulse Lines from all phones into thin air -->
  <g stroke="#ffffff" stroke-width="1" stroke-dasharray="2 4" opacity="0.3">
    <path d="M 175 525 Q 300 470 380 490" />
    <path d="M 380 490 Q 480 460 600 475" />
    <path d="M 600 475 Q 700 460 815 485" />
    <path d="M 815 485 Q 920 480 1025 505" />
  </g>

  <!-- Big Poignant Floating Headline -->
  <text x="600" y="110" fill="#ffffff" font-size="34" font-weight="900" font-family="sans-serif" text-anchor="middle" letter-spacing="0.05em">
    EVERY GENERATION GLUED TO THE SCREEN
  </text>
  <text x="600" y="150" fill="#94a3b8" font-size="18" font-family="sans-serif" text-anchor="middle">
    Toddlers, Teens, Young Adults, Parents, and Elders — All Transfixed in the Dark
  </text>
</svg>